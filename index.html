p<!DOCTYPE html>
<html lang="kaa">
<head>
    <meta charset="UTF-8">
    <title>Falsafiy Family Feud - Qaraqalpaqsha</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #f1c40f; text-shadow: 2px 2px #000; }
        
        /* Tablo / Ochkolar */
        .teams-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .team-card {
            background-color: #16213e;
            border: 2px solid #0f3460;
            border-radius: 10px;
            padding: 10px 20px;
            width: 18%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .team-card h3 { margin: 5px 0; color: #e94560; }
        .score { font-size: 24px; font-weight: bold; color: #f1c40f; }

        /* Oyın Ekranı */
        .board {
            background-color: #0f3460;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
        }
        .question { font-size: 22px; margin-bottom: 20px; color: #ffffff; }
        
        .answer-slot {
            background-color: #1a1a2e;
            border: 2px solid #f1c40f;
            margin: 10px 0;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            transition: 0.3s;
        }
        .answer-slot:hover { background-color: #16213e; }
        .hidden-text { color: #f1c40f; }
        
        /* Qátelikler (Strikes) */
        .strikes { font-size: 40px; color: #e94560; margin: 15px 0; height: 50px; }
        
        /* Knopkalar */
        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .btn:hover { background-color: #ff6b6b; }
        .btn-add { background-color: #2ecc71; }
        .btn-add:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <h1>FALSAFIYLIK</h1>

<!-- CSS Style bólimi -->
<style>
    .teams-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        width: 100%;
        max-width: 850px;
        margin-bottom: 20px;
    }
    .team-card {
        background-color: #1e293b;
        border: 2px solid #334155;
        border-radius: 10px;
        padding: 10px 15px;
        text-align: center;
    }
    .team-title {
        color: #f43f5e;
        font-size: 11px;
        font-weight: bold;
        margin-bottom: 3px;
    }
    .team-score {
        font-size: 18px;
        font-weight: bold;
        color: #facc15;
        margin-bottom: 5px;
        background: #0f172a;
        padding: 2px;
        border-radius: 4px;
        border: 1px dashed #475569;
    }
    .score-controls {
        display: flex;
        gap: 4px;
    }
    .btn-score {
        flex: 1;
        padding: 4px 2px;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        font-size: 10px;
        color: white;
    }
    .btn-plus { background-color: #22c55e; }
    .btn-plus:hover { background-color: #16a34a; }
    .btn-minus { background-color: #ef4444; }
    .btn-minus:hover { background-color: #dc2626; }
</style>

<!-- HTML bólimi -->
<div class="teams-container">
    <div class="team-card">
        <div class="team-title">1-Komanda</div>
        <div class="team-score" id="score-1" contenteditable="true" onblur="updateManualScore(1)">0</div>
        <div class="score-controls">
            <button class="btn-score btn-plus" onclick="adjustScore(1, currentPot)">+ Pot</button>
            <button class="btn-score btn-minus" onclick="adjustScore(1, -10)">-10</button>
        </div>
    </div>
    <div class="team-card">
        <div class="team-title">2-Komanda</div>
        <div class="team-score" id="score-2" contenteditable="true" onblur="updateManualScore(2)">0</div>
        <div class="score-controls">
            <button class="btn-score btn-plus" onclick="adjustScore(2, currentPot)">+ Pot</button>
            <button class="btn-score btn-minus" onclick="adjustScore(2, -10)">-10</button>
        </div>
    </div>
    <div class="team-card">
        <div class="team-title">3-Komanda</div>
        <div class="team-score" id="score-3" contenteditable="true" onblur="updateManualScore(3)">0</div>
        <div class="score-controls">
            <button class="btn-score btn-plus" onclick="adjustScore(3, currentPot)">+ Pot</button>
            <button class="btn-score btn-minus" onclick="adjustScore(3, -10)">-10</button>
        </div>
    </div>
    <div class="team-card">
        <div class="team-title">4-Komanda</div>
        <div class="team-score" id="score-4" contenteditable="true" onblur="updateManualScore(4)">0</div>
        <div class="score-controls">
            <button class="btn-score btn-plus" onclick="adjustScore(4, currentPot)">+ Pot</button>
            <button class="btn-score btn-minus" onclick="adjustScore(4, -10)">-10</button>
        </div>
    </div>
</div>

<!-- JavaScript bólimi -->
<script>
    function adjustScore(teamNum, amount) {
        if (amount === currentPot && currentPot === 0) {
            alert("Áweljúren juwaplardı ashıń!");
            return;
        }
        teamScores[teamNum - 1] += amount;
        if (teamScores[teamNum - 1] < 0) teamScores[teamNum - 1] = 0;
        
        document.getElementById("score-" + teamNum).innerText = teamScores[teamNum - 1];
        
        if (amount === currentPot) {
            currentPot = 0;
            updatePotDisplay();
        }
    }

    function updateManualScore(teamNum) {
        const val = parseInt(document.getElementById("score-" + teamNum).innerText);
        if (!isNaN(val)) {
            teamScores[teamNum - 1] = val;
        } else {
            document.getElementById("score-" + teamNum).innerText = teamScores[teamNum - 1];
        }
    }
</script>

    <!-- Oyın Maydanı -->
    <div class="board">
        <div class="question" id="question-text">Raund Júklennekte...</div>
        
        <div id="answers-container"></div>

        <!-- X (Qáte) Bólimi -->
        <div class="strikes" id="strike-display"></div>
        
        <div>
            <button class="btn" onclick="addStrike()">❌ QÁTE (X)</button>
            <button class="btn" onclick="resetStrikes()">X-lerdi tazalaw</button>
            <button class="btn" style="background-color: #3498db;" onclick="nextRound()">Keyingi Raund ➡️</button>
        </div>
    </div>

    <script>
        // Web Audio API orqalı dawıslar sinteticheskiy jaratıldı (Siz jibergen exact fayllarday esitiledi)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 1. Siz jibergen Durıs Juwap Dawısı (Ding - High Bell)
        function playCorrectSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.type = 'sine';
            osc2.type = 'sine';

            osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
            osc1.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); // G5
            osc1.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.24); // C6

            osc2.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.24);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);

            osc1.start(audioCtx.currentTime);
            osc2.start(audioCtx.currentTime);
            osc1.stop(audioCtx.currentTime + 1.2);
            osc2.stop(audioCtx.currentTime + 1.2);
        }

        // 2. Siz jibergen Qáte Juwap Dawısı (Buzzer - Low Sawtooth)
        function playWrongSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(130, audioCtx.currentTime); // Low Buzz
            osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.6);
        }

        // Sorawlar hám Juwaplar Bazası (Qaraqalpaqsha)
                const rounds = [
            {
                question: "1-RAUND: Áyyemgi Indiya turmısı hám dún'yaǵa kóz-qarası tuwralı maǵlumot beriwshi eń ertegi 4 qabatlı estelikler:",
                answers: [
                    { text: "1. Vedalar", points: 45, revealed: false },
                    { text: "2. Braxmanlar", points: 25, revealed: false },
                    { text: "3. Aran'iyatlar", points: 20, revealed: false },
                    { text: "4. Upanishadlar", points: 10, revealed: false }
                ]
            },
            {
                question: "2-RAUND: Zoroastrizm dininde ádep-ikramlıqtıń tiykarǵı kredosı bolǵan 3 tiykarǵı túsuncha (triada):",
                answers: [
                    { text: "1. Jaqsı oy (Gumata)", points: 45, revealed: false },
                    { text: "2. Jaqsı sóz (Guxta)", points: 25, revealed: false },
                    { text: "3. Jaqsı is (Gvarishta)", points: 20, revealed: false },
                    { text: "4. Denelik hám ruwxıy tazalıq", points: 10, revealed: false }
                ]
            },
            {
                question: "3-RAUND: Qıtay filosofiyasında dún'ya hám adam tuwralı túsunchalarda qollanılatuǵın 2 qarama-qarshi baslama:",
                answers: [
                    { text: "1. In' (qarańǵı, passiv)", points: 55, revealed: false },
                    { text: "2. Yan' (jaqtı, aktiv)", points: 35, revealed: false },
                    { text: "3. Dao (jol)", points: 5, revealed: false },
                    { text: "4. Aspan", points: 5, revealed: false }
                ]
            },
            {
                question: "4-RAUND: B.e.sh. VI ásirde Indiyada payda bolǵan, tórt shınlıqqa tiykarlanǵan diniy-filosofiyalıq aǵım:",
                answers: [
                    { text: "1. Buddizm", points: 45, revealed: false },
                    { text: "2. Djaynizm", points: 25, revealed: false },
                    { text: "3. Induizm", points: 20, revealed: false },
                    { text: "4. Lokayata", points: 10, revealed: false }
                ]
            },
            {
                question: "5-RAUND: Qıtayda genis tarqalǵan, ádep-ikramlıq hám social normalarǵa tiykarlanǵan ta'limat:",
                answers: [
                    { text: "1. Konfuciylik", points: 45, revealed: false },
                    { text: "2. Daosizm", points: 25, revealed: false },
                    { text: "3. Legizm", points: 20, revealed: false },
                    { text: "4. Moistlik", points: 10, revealed: false }
                ]
            },
            {
                question: "6-RAUND: Islam filosofiyasında erik erkinligi hám táshdiyr máselelerin ortaǵa qoyǵan tiykarǵı aǵımlar:",
                answers: [
                    { text: "1. Mutazalitler", points: 45, revealed: false },
                    { text: "2. Djabaritler", points: 25, revealed: false },
                    { text: "3. Kadaritler", points: 20, revealed: false },
                    { text: "4. Mutakallimler", points: 10, revealed: false }
                ]
            },
            {
                question: "7-RAUND: Oraylıq Aziyada shıǵısqa hám batısqa tanılǵan dáslepki ensiklopedist alimlar:",
                answers: [
                    { text: "1. Abu Nasr al-Farabi", points: 45, revealed: false },
                    { text: "2. Abu Rayxan Beruniy", points: 25, revealed: false },
                    { text: "3. Abu Ali Ibn Sina", points: 20, revealed: false },
                    { text: "4. Muxammed al-Xorezmi", points: 10, revealed: false }
                ]
            },
            {
                question: "8-RAUND: Temuriyler dáwirinde Samarqandta ilim hám astronomiyanı rawajlandirǵan tiykarǵı shaxslar:",
                answers: [
                    { text: "1. Mirzo Uluǵbek", points: 45, revealed: false },
                    { text: "2. Giyasiddin al-Kashi", points: 25, revealed: false },
                    { text: "3. Ali Kushchi", points: 20, revealed: false },
                    { text: "4. Qazizade Rumi", points: 10, revealed: false }
                ]
            },
            {
                question: "9-RAUND: Alisher Nawayı óziniń dóretiwshiliginde tiykarlanǵan tiykarǵı filosofiyalıq aǵımlar:",
                answers: [
                    { text: "1. Panteizm", points: 45, revealed: false },
                    { text: "2. Sufizm", points: 30, revealed: false },
                    { text: "3. Gumanizm", points: 15, revealed: false },
                    { text: "4. Racionalizm", points: 10, revealed: false }
                ]
            },
            {
                question: "10-RAUND: Sufizmniń Oraylıq Aziyadaǵı eń ataqlı hám húkimdar qatlamlar menen islesken tuwısqanlıq (orden) tiykarshısı:",
                answers: [
                    { text: "1. Baxouddin Naqshband", points: 45, revealed: false },
                    { text: "2. Xodja Ubaydulla Axrar", points: 25, revealed: false },
                    { text: "3. Abuxalik al-Gijduvani", points: 20, revealed: false },
                    { text: "4. Ahmad Yassawi", points: 10, revealed: false }
                ]
            }
        ];

        let currentRound = 0;
        let scores = [0, 0, 0, 0];
        let roundTotal = 0;
        let strikes = 0;

        function loadRound() {
            const roundData = rounds[currentRound];
            document.getElementById('question-text').innerText = roundData.question;
            const container = document.getElementById('answers-container');
            container.innerHTML = '';
            roundTotal = 0;
            resetStrikes();

            roundData.answers.forEach((ans, index) => {
                const div = document.createElement('div');
                div.className = 'answer-slot';
                div.onclick = () => revealAnswer(index);
                
                if (ans.revealed) {
                    div.innerHTML = `<span>${ans.text}</span> <span>${ans.points} pt</span>`;
                    div.style.borderColor = '#2ecc71';
                } else {
                    div.innerHTML = `<span class="hidden-text">[ ${index + 1} - JUWAP ]</span> <span>??</span>`;
                }
                container.appendChild(div);
            });
        }

        function revealAnswer(index) {
            const ans = rounds[currentRound].answers[index];
            if (!ans.revealed) {
                ans.revealed = true;
                roundTotal += ans.points;
                
                // Durıs dawıs oynatıw
                playCorrectSound();

                loadRound();
            }
        }

        function addStrike() {
            if (strikes < 3) {
                strikes++;
                document.getElementById('strike-display').innerText = '❌ '.repeat(strikes);
                
                // Qáte dawıs oynatıw
                playWrongSound();
            }
        }

        function resetStrikes() {
            strikes = 0;
            document.getElementById('strike-display').innerText = '';
        }

        function addPoints(teamIndex) {
            scores[teamIndex - 1] += roundTotal;
            document.getElementById(`score${teamIndex}`).innerText = scores[teamIndex - 1];
            roundTotal = 0;
        }

        function nextRound() {
            if (currentRound < rounds.length - 1) {
                currentRound++;
                loadRound();
            } else {
                alert("Óyın juqlandı! Eń kóp ochko toplasań komanda jeńimpaz!");
            }
        }

        // Óyındı baslaw
        loadRound();
    </script>
</body>
</html>
